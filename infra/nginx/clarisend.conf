# APEX: clarisend.co -> 301 to www.clarisend.co
server {
  listen 443 ssl;
  server_name clarisend.co;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
    try_files $uri =404;
  }

  return 301 https://www.clarisend.co$request_uri;

  ssl_certificate /etc/letsencrypt/live/clarisend.co/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/clarisend.co/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# HTTP -> HTTPS
server {
  listen 80;
  server_name app.clarisend.co;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
    try_files $uri =404;
  }

  location / {
    return 301 https://app.clarisend.co$request_uri;
  }
}

server {
  listen 80;
  server_name clarisend.co www.clarisend.co;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
    try_files $uri =404;
  }

  location / {
    return 301 https://www.clarisend.co$request_uri;
  }
}
