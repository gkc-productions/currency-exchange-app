  }

  ssl_certificate /etc/letsencrypt/live/clarisend.co/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/clarisend.co/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
